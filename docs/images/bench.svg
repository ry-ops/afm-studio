<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#5ac8fa"/><stop offset="0.33" stop-color="#7d7aff"/><stop offset="0.67" stop-color="#ff6fae"/><stop offset="1.00" stop-color="#ffb340"/></linearGradient><linearGradient id="gen" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#7d7aff"/><stop offset="1.00" stop-color="#5ac8fa"/></linearGradient></defs>
