<text x="56" y="184" class="mono" font-size="15" fill="#e8eaf0" xml:space="preserve" textLength="423.00" lengthAdjust="spacingAndGlyphs">Thanks for the quick turnaround on the invoice!</text>
<text x="56" y="212" class="mono" font-size="15" fill="#e8eaf0" xml:space="preserve" textLength="414.00" lengthAdjust="spacingAndGlyphs">One thing: the March 14 delivery to our Austin</text>
<text x="56" y="240" class="mono" font-size="15" fill="#e8eaf0" xml:space="preserve" textLength="405.00" lengthAdjust="spacingAndGlyphs">office arrived two days late, and the box was</text>
<text x="56" y="268" class="mono" font-size="15" fill="#e8eaf0" xml:space="preserve" textLength="387.00" lengthAdjust="spacingAndGlyphs">crushed. Can you send a replacement for the</text>
<text x="56" y="296" class="mono" font-size="15" fill="#e8eaf0" xml:space="preserve" textLength="450.00" lengthAdjust="spacingAndGlyphs">cracked monitor stand by Friday? — Dana Whitfield,</text>
